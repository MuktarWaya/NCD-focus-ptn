# Legacy URL only: the application and API now run on Cloudflare Workers + D1.
[build]
  publish = "cloudflare/legacy-redirect"

[[redirects]]
  from = "/*"
  to = "https://ncd-focus-ptn.muktar32.workers.dev/:splat"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Cache-Control = "no-store"
